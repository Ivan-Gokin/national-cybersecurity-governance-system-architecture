# Checks the data on every pull request; on main also builds the site and publishes it to GitHub Pages.
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Check and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check data
        run: python3 scripts/validate.py --stats
      - name: Build the site into _site/
        run: python3 scripts/build.py
      # The built site is kept with every run (Actions -> the run -> Artifacts -> site), so it can be
      # downloaded and opened locally even while the repository is private and Pages is off.
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          retention-days: 30
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
